name: Android checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'
      - uses: android-actions/setup-android@v3
      - name: Build, test, lint, and verify release privacy
        run: ./gradlew assembleDebug assembleRelease test lint generateLicenseReport verifyReleaseManifestPrivacy
