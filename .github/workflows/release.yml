name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Verify the signed semantic version tag
        env:
          ALFAJR_RELEASE_TAG_SIGNING_PUBLIC_KEY: ${{ secrets.ALFAJR_RELEASE_TAG_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "$ALFAJR_RELEASE_TAG_SIGNING_PUBLIC_KEY"
          printf '%s' "$ALFAJR_RELEASE_TAG_SIGNING_PUBLIC_KEY" | gpg --batch --import
          # actions/checkout leaves refs/tags/<name> pointing at the commit, which
          # discards the annotated tag object the signature lives on. Re-fetch the
          # real tag, and fail loudly rather than silently skipping verification.
          git fetch --force --tags origin
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git verify-tag "$GITHUB_REF_NAME"
          version="$(./gradlew --no-daemon -q :app:printVersionName)"
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Restore the release signing key
        env:
          ALFAJR_RELEASE_KEYSTORE_BASE64: ${{ secrets.ALFAJR_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ALFAJR_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$ALFAJR_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alfajr-release.jks"
      - name: Build signed release APK
        env:
          ALFAJR_RELEASE_STORE_FILE: ${{ runner.temp }}/alfajr-release.jks
          ALFAJR_RELEASE_STORE_PASSWORD: ${{ secrets.ALFAJR_RELEASE_STORE_PASSWORD }}
          ALFAJR_RELEASE_KEY_ALIAS: ${{ secrets.ALFAJR_RELEASE_KEY_ALIAS }}
          ALFAJR_RELEASE_KEY_PASSWORD: ${{ secrets.ALFAJR_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease verifyReleaseManifestPrivacy generateLicenseReport
      - name: Name the APK after the app and create its checksum
        run: |
          cd app/build/outputs/apk/release
          apk="AlfajrAlarm-${GITHUB_REF_NAME#v}.apk"
          mv app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
      - name: Publish APK and checksum
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Compatibility
            Requires Android 8.0 (API 26) or newer.

            ## Privacy and permissions
            Alfajr Alarm is offline and requests no internet, location, or storage permission. Attribution and third-party notices are in `docs/THIRD_PARTY_NOTICES.md`.

            ## Known platform limitations
            Force-stop can suppress scheduled alarms until the app is reopened. OEM power managers, Do Not Disturb policy, and Bluetooth routing are device-controlled.

            On Android 14 and newer the full-screen alarm needs the "Full screen notifications" permission, which is not granted automatically to a sideloaded build. Until it is granted the alarm still rings, but arrives as a notification rather than covering the lock screen. The app reports this on its home screen and links straight to the setting. Verify one real alarm before relying on a device.
          files: |
            app/build/outputs/apk/release/AlfajrAlarm-*.apk
            app/build/outputs/apk/release/AlfajrAlarm-*.apk.sha256
